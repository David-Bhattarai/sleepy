<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breathing Exercise - AI Mental Health Therapist</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #1a202c; /* A calming dark blue */
        }
        .breathing-circle {
            width: 200px;
            height: 200px;
            background-color: #4a5568; /* A soft gray-blue */
            border-radius: 50%;
            transition: transform 4s ease-in-out;
        }
        .breathing-text {
            font-size: 2rem;
            color: white;
            transition: opacity 1s ease-in-out;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen">

    <div class="text-center">
        <div id="breathing-circle" class="breathing-circle mx-auto mb-8"></div>
        <p id="breathing-text" class="breathing-text font-semibold">Get Ready...</p>
    </div>

    <div class="absolute top-4 left-4">
        <a href="dashboard.html" class="px-4 py-2 bg-gray-600 text-white rounded-md hover:bg-gray-700">&larr; Back to Dashboard</a>
    </div>

    <!-- Calming background music -->
    <audio id="calm-music" loop>
        <source src="https://cdn.pixabay.com/download/audio/2022/10/11/audio_a11b6b4b45.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <script src="breathing.js"></script>
</body>
</html>
