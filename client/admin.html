<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - AURA</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Animated Background -->
    <div class="orb-container">
        <div class="orb"></div>
        <div class="orb"></div>
    </div>

    <!-- Glassmorphism Navigation Bar -->
    <nav class="glass-nav fixed top-0 left-0 right-0 z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="text-2xl font-extrabold text-white tracking-wider">AURA</a>
                </div>
                <div class="hidden md:block">
                    <div id="nav-links" class="ml-10 flex items-baseline space-x-4">
                        <!-- Links injected by app.js -->
                    </div>
                </div>
                <div class="-mr-2 flex md:hidden">
                    <button id="menu-btn" type="button" class="bg-gray-800 bg-opacity-50 inline-flex items-center justify-center p-2 rounded-md text-gray-300 hover:text-white focus:outline-none">
                        <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
                    </button>
                </div>
            </div>
        </div>
        <div id="mobile-menu" class="md:hidden hidden"></div>
    </nav>

    <!-- Main Content -->
    <main class="pt-24 pb-10 px-4 md:px-6">
        <div class="max-w-6xl mx-auto">
            <div class="glass-card p-8">
                <h1 class="text-3xl font-extrabold text-white text-center mb-6">Admin Dashboard</h1>
                
                <div class="bg-black bg-opacity-20 rounded-xl border border-white/10 p-6">
                    <h2 class="text-xl font-bold text-white mb-4">All Users</h2>
                    <div class="overflow-x-auto">
                        <table class="min-w-full text-left">
                            <thead class="border-b border-white/20">
                                <tr>
                                    <th class="py-3 px-4 text-sm font-bold uppercase tracking-wider text-gray-300">Name</th>
                                    <th class="py-3 px-4 text-sm font-bold uppercase tracking-wider text-gray-300">Email</th>
                                    <th class="py-3 px-4 text-sm font-bold uppercase tracking-wider text-gray-300">Joined On</th>
                                    <th class="py-3 px-4 text-sm font-bold uppercase tracking-wider text-gray-300">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="user-list">
                                <!-- User data will be dynamically inserted here -->
                            </tbody>
                        </table>
                    </div>
                </div>
                 <div id="error-message" class="text-red-400 text-center mt-6"></div>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
    <script src="admin.js"></script>
</body>
</html>
