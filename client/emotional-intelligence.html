<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotional Intelligence Profile - AURA</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

    <!-- Animated Background -->
    <div class="orb-container">
        <div class="orb"></div>
        <div class="orb"></div>
    </div>

    <!-- Glassmorphism Navigation Bar -->
    <nav class="glass-nav fixed top-0 left-0 right-0 z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center">
                    <a href="/" class="text-2xl font-extrabold text-white tracking-wider">AURA</a>
                </div>
                <div class="hidden md:block">
                    <div id="nav-links" class="ml-10 flex items-baseline space-x-4">
                        <!-- Links injected by app.js -->
                    </div>
                </div>
                <div class="-mr-2 flex md:hidden">
                    <button id="menu-btn" type="button" class="bg-gray-800 bg-opacity-50 inline-flex items-center justify-center p-2 rounded-md text-gray-300 hover:text-white focus:outline-none">
                        <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
                    </button>
                </div>
            </div>
        </div>
        <div id="mobile-menu" class="md:hidden hidden"></div>
    </nav>

    <!-- Main Content -->
    <main class="pt-24 pb-10 px-4 md:px-6">
        <div class="max-w-5xl mx-auto">
            <div class="glass-card p-8">
                <h1 class="text-3xl font-extrabold text-white text-center mb-6">Your Emotional Intelligence (EI) Profile</h1>
                
                <!-- EI Scores Section -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8">
                    <!-- Emotional Awareness Card -->
                    <div class="p-6 bg-black bg-opacity-20 rounded-xl border border-white/10 text-center">
                        <h2 class="text-xl font-bold text-indigo-300 mb-2">Emotional Awareness</h2>
                        <p class="text-5xl font-bold text-white" id="awareness-score">Loading...</p>
                        <p class="text-gray-400 mt-2">Measures the diversity of emotional language used in your conversations.</p>
                    </div>
                    <!-- Emotional Regulation Card -->
                    <div class="p-6 bg-black bg-opacity-20 rounded-xl border border-white/10 text-center">
                        <h2 class="text-xl font-bold text-purple-300 mb-2">Emotional Regulation</h2>
                        <p class="text-5xl font-bold text-white" id="regulation-score">Loading...</p>
                        <p class="text-gray-400 mt-2">Indicates how quickly you return to a neutral state from a negative one.</p>
                    </div>
                </div>

                <!-- EI History Chart -->
                <div>
                    <h2 class="text-2xl font-bold text-white mb-4 text-center">Your EI Progress Over Time</h2>
                    <div class="p-6 bg-black bg-opacity-20 rounded-xl border border-white/10">
                         <canvas id="ei-chart"></canvas>
                    </div>
                </div>
                 <div id="error-message" class="text-red-400 text-center mt-6"></div>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
    <script src="emotional-intelligence.js"></script>
</body>
</html>
